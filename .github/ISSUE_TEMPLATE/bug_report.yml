name: Bug report
description: Report a reproducible WetoLoop defect
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve WetoLoop. Do not report security vulnerabilities here; follow SECURITY.md."
  - type: input
    id: version
    attributes:
      label: WetoLoop version
      placeholder: 0.0.1
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands, fixture shape or repository structure when relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node, Python and other relevant versions.
